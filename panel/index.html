<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automatyzator</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<header class="gora">
  <div class="logo">
    <span class="znak">⟳</span>
    <div>
      <strong>Automatyzator</strong>
      <small>Tax Polonica · na tym komputerze</small>
    </div>
  </div>
  <div class="gora-prawa">
    <span id="tryb-znacznik" class="znacznik">…</span>
    <span id="zegar" class="zegar"></span>
  </div>
</header>

<nav class="zakladki">
  <button data-widok="scenariusze" class="aktywna">Scenariusze</button>
  <button data-widok="historia">Historia</button>
  <button data-widok="ustawienia">Ustawienia</button>
  <button data-widok="polaczenia">Połączenia</button>
</nav>

<main>
  <div id="ostrzezenia"></div>

  <section id="widok-scenariusze" class="widok">
    <div id="lista-scenariuszy"></div>
  </section>

  <section id="widok-historia" class="widok ukryty">
    <div class="karta">
      <h2>Historia wysyłek</h2>
      <p class="opis">Każde uruchomienie w trybie testowym i na żywo. Podgląd nie jest zapisywany.</p>
      <div id="historia"></div>
    </div>
  </section>

  <section id="widok-ustawienia" class="widok ukryty">
    <form id="form-ustawienia" class="karta">
      <h2>Ustawienia</h2>

      <fieldset class="tryby">
        <legend>Tryb pracy</legend>
        <label class="tryb">
          <input type="radio" name="tryb" value="test">
          <span><strong>Test</strong> — wszystkie maile idą na adres testowy, arkusz nie jest odznaczany.
          Bezpieczne, gdy Make nadal działa.</span>
        </label>
        <label class="tryb">
          <input type="radio" name="tryb" value="na_zywo">
          <span><strong>Na żywo</strong> — maile idą do klientów, arkusz jest odznaczany.
          <em>Najpierw wyłącz scenariusze A i B w Make</em>, inaczej klienci dostaną maile podwójnie.</span>
        </label>
      </fieldset>

      <label>Adres testowy
        <input name="adresTestowy" type="email" placeholder="np. twoj.adres@gmail.com">
      </label>
      <label>Nadawca (jak klient widzi „Od”)
        <input name="nadawca">
      </label>
      <label>Podpis pod każdym mailem (HTML: &lt;br&gt; = nowa linia)
        <textarea name="podpis" rows="4"></textarea>
      </label>
      <label>Bezpiecznik — najwięcej maili w jednym przebiegu
        <input name="maksMailiNaPrzebieg" type="number" min="1" max="500">
      </label>
      <div class="przyciski">
        <button type="submit" class="glowny">Zapisz ustawienia</button>
        <span class="wynik" id="wynik-ustawien"></span>
      </div>
    </form>
  </section>

  <section id="widok-polaczenia" class="widok ukryty">
    <div class="karta">
      <h2>Arkusz Google</h2>
      <p class="opis" id="google-stan"></p>
      <label>Klucz konta technicznego (wklej całą zawartość pobranego pliku .json)
        <textarea id="google-klucz" rows="5" placeholder='{ "type": "service_account", ... }'></textarea>
      </label>
      <div class="przyciski">
        <button id="google-zapisz" class="glowny">Zapisz klucz</button>
        <button id="google-sprawdz">Sprawdź połączenie</button>
        <span class="wynik" id="wynik-google"></span>
      </div>
    </div>

    <form class="karta" id="form-poczta">
      <h2>Poczta (wysyłka)</h2>
      <p class="opis" id="poczta-stan"></p>
      <div class="rzad">
        <label>Serwer SMTP <input name="host"></label>
        <label class="waski">Port <input name="port" type="number"></label>
      </div>
      <label>Użytkownik (pełny adres e-mail) <input name="uzytkownik"></label>
      <label>Hasło do skrzynki <input name="haslo" type="password" autocomplete="new-password" placeholder="wpisz, aby ustawić lub zmienić"></label>
      <div class="przyciski">
        <button type="submit" class="glowny">Zapisz</button>
        <button type="button" id="poczta-sprawdz">Wyślij mail próbny</button>
        <span class="wynik" id="wynik-poczta"></span>
      </div>
    </form>
  </section>
</main>

<template id="szablon-scenariusza">
  <article class="karta scenariusz">
    <div class="sc-gora">
      <div>
        <h2 class="sc-nazwa"></h2>
        <p class="opis sc-opis"></p>
      </div>
      <label class="przelacznik" title="Włącz / wyłącz harmonogram">
        <input type="checkbox" class="sc-wlaczony">
        <span class="suwak"></span>
        <span class="sc-wlaczony-opis"></span>
      </label>
    </div>

    <div class="sc-harmonogram">
      <span>Codziennie o</span>
      <input type="time" class="sc-godzina">
      <span class="sc-ostatnio opis"></span>
    </div>

    <ol class="kroki"></ol>

    <div class="przyciski">
      <button class="sc-podglad">Podgląd — co by poszło</button>
      <button class="sc-uruchom glowny">Uruchom teraz</button>
    </div>
    <div class="sc-wynik"></div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
